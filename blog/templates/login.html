{% extends "base.html" %}

{% block title %}Вхід — GroupPortal{% endblock %}

{% block content %}

<div class="auth-page">

```
<div class="auth-card">

    <div class="auth-icon">🔐</div>

    <div class="auth-badge">
        GROUP PORTAL
    </div>

    <h1>З поверненням!</h1>

    <p class="auth-description">
        Увійди до свого акаунта
    </p>


    {% if form.errors %}

    <div class="form-error">
        Неправильний username або пароль.
    </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}

        <div class="input-group">

            <label for="id_username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Введи username"
                autocomplete="username"
                required
            >

        </div>


        <div class="input-group">

            <label for="id_password">
                Пароль
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Введи пароль"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="form-button">

            Увійти

            <span>→</span>

        </button>

    </form>


    <div class="auth-footer">

        <span>
            Ще немає акаунта?
        </span>

        <a href="{% url 'register' %}">
            Зареєструватися
        </a>

    </div>

</div>
```

</div>

{% endblock %}
